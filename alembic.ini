# Alembic configuration (ComplianceIQ, Phase 4).
#
# SECURITY: there is deliberately NO `sqlalchemy.url` here.
#
# The stock Alembic template puts a full connection string — password
# included — in this file, which is committed to version control. That is
# one of the most common ways database credentials leak from a Python
# project. Instead, `env.py` builds the URL from
# `DatabaseConfig.from_env()`, the same environment-driven path the
# application itself uses, so there is exactly one place credentials come
# from and it is not a file in this repository.
#
# Usage:
#   export COMPLIANCEIQ_DB_HOST=... COMPLIANCEIQ_DB_PASSWORD=...
#   alembic upgrade head

[alembic]
script_location = infrastructure/persistence/postgres/migrations

# Timestamped, ordered, human-readable filenames: `0001_initial_schema`
# sorts and reads better than a bare revision hash when reviewing a
# migration history in a pull request.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

# Migrations are written and reviewed by hand; keeping them out of the
# "just autogenerate it" habit is intentional (see docs).
timezone = UTC


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
