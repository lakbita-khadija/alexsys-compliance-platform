  - id: azure-nsg-winrm-open-to-internet
    applies_to_resource_type: azure_network_security_group
    framework: iso_27001
    control_id: A.8.20
    domain: network
    severity: high
    confidence: high
    service: network
    version: "1.0.0"
    title: "Network security group allows WinRM (5985) from the internet"
    description: "An inbound Allow rule permits TCP/5985 (WinRM over HTTP) from a wildcard or Internet source."
    rationale: "WinRM over HTTP is an unencrypted remote-management channel; internet exposure makes it both interceptable and directly attackable."
    condition:
      field: unrestricted_ingress_ports
      operator: contains
      value: 5985
    evidence_template: "Network security group {name} allows unrestricted ingress on port 5985 (open ports: {unrestricted_ingress_ports})."
    tags: [network, exposure, winrm]
    remediation:
      summary: "Remove internet-facing WinRM ingress; use Azure Bastion or WinRM over HTTPS from a restricted source."
      why_it_matters: "An unencrypted Windows remote-management port is currently reachable from the entire internet."
      how_to_fix: "Restrict the source address prefix, and prefer WinRM over HTTPS (5986) or Azure Bastion."

  - id: azure-nsg-unrestricted-ingress-any-port
    applies_to_resource_type: azure_network_security_group
    framework: iso_27001
    control_id: A.8.20
    domain: network
    severity: high
    confidence: medium
    service: network
    version: "1.0.0"
    title: "Network security group has at least one inbound rule open to the internet"
    description: >
      Composite catch-all: true whenever any inbound Allow rule permits
      a wildcard/Internet source, regardless of port — including the
      port-range and "any port" rules the named-port rules above cannot
      see.
    rationale: "A wide port range or 'any port' rule opened to the internet is at least as risky as any single sensitive port, but isn't caught by the single-port rules above."
    condition:
      field: has_unrestricted_ingress
      operator: equals
      value: true
    evidence_template: "Network security group {name} has at least one inbound rule open to the internet ({security_rule_count} rule(s) total)."
    tags: [network, exposure, composite]
    remediation:
      summary: "Review every inbound rule on this NSG and restrict any wildcard/Internet source."
      why_it_matters: "At least one rule on this NSG accepts traffic from anywhere on the internet."
      how_to_fix: "Replace wildcard/Internet sources with specific address prefixes, virtual networks, or application security groups."
