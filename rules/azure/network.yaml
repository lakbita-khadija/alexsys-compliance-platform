# Azure Network Security Group rules.
#
# Mirrors rules/aws/security_group.yaml's structure exactly, including
# the same division of labour: `unrestricted_ingress_ports` is a
# factual list produced by the normalizer
# (infrastructure/cloud/azure/normalizers/network.py), and THIS file is
# where "which ports are sensitive" is decided.
#
# Azure-specific note: only inbound Allow rules from a wildcard/
# Internet source count as unrestricted (Deny rules and outbound rules
# are excluded by the normalizer), and port RANGES set
# `has_unrestricted_ingress` without being expanded into individual
# ports — the same documented single-port-only limitation the AWS
# normalizer carries.
rules:
  - id: azure-nsg-ssh-open-to-internet
    applies_to_resource_type: azure_network_security_group
    framework: iso_27001
    control_id: A.8.20
    domain: network
    severity: critical
    confidence: high
    service: network
    version: "1.0.0"
    title: "Network security group allows SSH (22) from the internet"
    description: "An inbound Allow rule permits TCP/22 from a wildcard or Internet source."
    rationale: "SSH exposed to the internet is a top initial-access vector for opportunistic scanning and brute-force attacks."
    condition:
      field: unrestricted_ingress_ports
      operator: contains
      value: 22
    evidence_template: "Network security group {name} allows unrestricted ingress on port 22 (open ports: {unrestricted_ingress_ports})."
    tags: [network, exposure, ssh]
    framework_mappings:
      - framework: cis_azure
        control: "6.1"
    remediation:
      summary: "Restrict SSH ingress to known administrative sources, or use Azure Bastion."
      why_it_matters: "Any host on the internet can currently attempt to connect to SSH on VMs protected by this NSG."
      how_to_fix: "Replace the wildcard/Internet source with a specific address prefix, or front administrative access with Azure Bastion and remove the rule."

  - id: azure-nsg-rdp-open-to-internet
    applies_to_resource_type: azure_network_security_group
    framework: iso_27001
    control_id: A.8.20
    domain: network
    severity: critical
    confidence: high
    service: network
    version: "1.0.0"
    title: "Network security group allows RDP (3389) from the internet"
    description: "An inbound Allow rule permits TCP/3389 from a wildcard or Internet source."
    rationale: "RDP exposed to the internet is a top ransomware initial-access vector, and Windows VMs are the Azure default for many workloads."
    condition:
      field: unrestricted_ingress_ports
      operator: contains
      value: 3389
    evidence_template: "Network security group {name} allows unrestricted ingress on port 3389 (open ports: {unrestricted_ingress_ports})."
    tags: [network, exposure, rdp]
    framework_mappings:
      - framework: cis_azure
        control: "6.2"
    remediation:
      summary: "Restrict RDP ingress to known administrative sources, or use Azure Bastion."
      why_it_matters: "Any host on the internet can currently attempt to connect to RDP on VMs protected by this NSG."
      how_to_fix: "Replace the wildcard/Internet source with a specific address prefix, or front administrative access with Azure Bastion and remove the rule."

  - id: azure-nsg-sql-open-to-internet
    applies_to_resource_type: azure_network_security_group
    framework: iso_27001
    control_id: A.8.20
    domain: network
    severity: critical
    confidence: high
    service: network
    version: "1.0.0"
    title: "Network security group allows SQL Server (1433) from the internet"
    description: "An inbound Allow rule permits TCP/1433 from a wildcard or Internet source."
    rationale: "A database port open to the internet exposes the data tier directly, bypassing every application-layer access control."
    condition:
      field: unrestricted_ingress_ports
      operator: contains
      value: 1433
    evidence_template: "Network security group {name} allows unrestricted ingress on port 1433 (open ports: {unrestricted_ingress_ports})."
    tags: [network, exposure, database]
    remediation:
      summary: "Restrict database ingress to the application tier only."
      why_it_matters: "Any host on the internet can currently attempt to connect directly to a SQL Server endpoint protected by this NSG."
      how_to_fix: "Replace the wildcard/Internet source with an application-subnet address prefix or an application security group."

