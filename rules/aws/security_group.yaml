          unresolved until a maintainer checks it and records provenance.
    remediation:
      summary: "Restrict RDP ingress to known administrative CIDRs, or remove it in favor of Session Manager/Fleet Manager."
      why_it_matters: "Any host on the internet can currently attempt to connect to RDP on instances protected by this group."
      how_to_fix: "Replace the 0.0.0.0/0 source with a specific CIDR, or use AWS Systems Manager Fleet Manager instead of exposing RDP at all."

  - id: security-group-mysql-open-to-world
    applies_to_resource_type: security_group
    framework: iso_27001
    control_id: A.8.20
    domain: network
    severity: critical
    confidence: high
    service: ec2
    version: "1.0.0"
    title: "Security group allows MySQL/Aurora (3306) from the entire internet"
    description: "An ingress rule permits TCP/3306 from 0.0.0.0/0 or ::/0."
    rationale: "A database port open to the internet exposes the data tier directly, bypassing any application-layer access control."
    condition:
      field: unrestricted_ingress_ports
      operator: contains
      value: 3306
    evidence_template: "Security group {resource_id} allows unrestricted ingress on port 3306 (open ports: {unrestricted_ingress_ports})."
    tags: [network, exposure, database]
    remediation:
      summary: "Restrict database ingress to the application tier's security group only."
      why_it_matters: "Any host on the internet can currently attempt to connect directly to a MySQL/Aurora endpoint protected by this group."
      how_to_fix: "Replace the 0.0.0.0/0 source with a security-group reference to the application tier, never a public CIDR."

