# Security Group rules (Phase 3B senior catalog).
#
# Grounded in blueprint §15: "règles restrictives" (compliant) vs
# "0.0.0.0/0 sur port sensible" (non-compliant). `unrestricted_ingress_ports`
# and `has_unrestricted_ingress` are factual attributes computed by the
# normalizer (infrastructure/cloud/aws/normalizers/security_group.py) —
# this file is where "which ports are sensitive" is actually decided,
# as a Rule concern rather than an Infrastructure one.
#
# The last rule below uses the ALLOWS relationship
# (security-group -> security-group, wired by
# infrastructure/cloud/aws/normalizers/security_group.py's
# extract_allows_relationships) to demonstrate genuine cross-resource
# evaluation: a security group whose own rules look fine can still be
# exposed transitively if it grants access to a group that is itself
# wide open.
rules:
  - id: security-group-ssh-open-to-world
    applies_to_resource_type: security_group
    framework: iso_27001
    control_id: A.8.20
    domain: network
    severity: critical
    confidence: high
    service: ec2
    version: "1.1.0"
    title: "Security group allows SSH (22) from the entire internet"
    description: "An ingress rule permits TCP/22 from 0.0.0.0/0 or ::/0."
    rationale: "SSH exposed to the internet is a top initial-access vector for opportunistic scanning and credential-stuffing/brute-force attacks."
    condition:
      field: unrestricted_ingress_ports
      operator: contains
      value: 22
    evidence_template: "Security group {resource_id} allows unrestricted ingress on port 22 (open ports: {unrestricted_ingress_ports})."
    tags: [network, exposure, ssh]
    framework_mappings:
      - framework: cis_aws
        control: "5.2"
        status: unresolved
        rationale: >-
          Control numbering is consistent with CIS AWS Foundations
          Benchmark v1.5.0 or later (networking moved to section 5).
          That is an inference from the numbering, not a verification
          against the published benchmark text, so this mapping stays
          unresolved until a maintainer checks it and records provenance.
    remediation:
      summary: "Restrict SSH ingress to known administrative CIDRs, or remove it in favor of Session Manager."
      why_it_matters: "Any host on the internet can currently attempt to connect to SSH on instances protected by this group."
      how_to_fix: "Replace the 0.0.0.0/0 source with a specific CIDR (VPN/bastion range), or use AWS Systems Manager Session Manager instead of exposing SSH at all."

